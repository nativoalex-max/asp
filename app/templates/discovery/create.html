{% extends "layout/base.html" %}

{% block content %}

<h2>Nuevo Discovery</h2>

<form action="/discovery/start" method="post">

    <div>

        <label>Target</label>

        <input
            type="text"
            name="target"
            value="192.168.1.0/24"
            required>

    </div>

    <br>

    <div>

        <label>Perfil</label>

        <select name="profile">

            <option value="quick">Quick</option>

            <option value="service">Service</option>

            <option value="os">OS Detection</option>

            <option value="aggressive">Aggressive</option>

            <option value="full">Full</option>

        </select>

    </div>

    <br>

    <input
        type="hidden"
        name="client_id"
        value="3cdbaad3-1195-4dc1-bc94-5f7a81a06fee">

    <button type="submit">

        Iniciar Discovery

    </button>

</form>

{% endblock %}
